<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINORA × DAPIN — Financial Management & Digital Lending</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <!-- Scripts — load order matters -->
  <script src="js/data.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views-finance.js"></script>
  <script src="js/views-dapin.js"></script>
  <script src="js/views-tools.js"></script>
  <script src="js/views-system.js"></script>
  <script src="js/app-core.js"></script>
  <script>
    // seed.js references Logic.generateSchedule — ensure seed runs after Logic is loaded
    document.addEventListener('DOMContentLoaded', () => {
      // Re-seed if Logic wasn't available during initial Store.load()
      const db = Store.load();
      if (db.loans && db.loans.some(l => !l.installments || l.installments.length === 0)) {
        db.loans.forEach(l => {
          if (!l.installments || l.installments.length === 0) {
            l.installments = Logic.generateSchedule(l.principal, l.interestRate, l.term, l.type);
          }
        });
        Store.save();
      }
      App.init();
    });
  </script>
</body>
</html>
